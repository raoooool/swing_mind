[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "swing_mind"
version = "0.1.0"
description = "Tennis video analysis engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "raoooool" }]
dependencies = [
  "opencv-python>=4.8.0",
  "mediapipe>=0.10.0",
  "numpy>=1.24.0",
  "scipy>=1.11.0",
]

[dependency-groups]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "ruff>=0.6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/swing_mind"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
